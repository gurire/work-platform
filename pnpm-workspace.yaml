packages:
  - apps/*
  - packages/*
  - infra

# Supply-chain guardrail: never install a package version published less than
# 7 days ago (in minutes). Freshly published versions are where most malicious
# releases and typosquats get caught and pulled.
minimumReleaseAge: 10080

# Only these packages may run install scripts (pnpm blocks all others by default).
onlyBuiltDependencies:
  - esbuild
